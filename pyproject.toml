[project]
name = "workshop-harness"
version = "2026.10.31"
description = "AI Agent Harness, 21-Skill Suite & CLI Automation Toolkit for Tech Workshops, BWAI, DevFest, and Hands-on Coding Labs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "reportlab>=4.0.0",
    "pymupdf>=1.23.0",
    "pillow>=10.0.0",
    "python-pptx>=1.0.2",
]

[project.scripts]
workshop-harness = "harness_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["harness_cli.py", "scripts", "skills", "templates"]

[tool.hatch.build.targets.sdist]
only-include = ["harness_cli.py", "scripts", "skills", "templates", "README.md", "pyproject.toml"]
