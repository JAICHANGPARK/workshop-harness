[project]
name = "workshop-harness"
version = "2026.08.01"
description = "AI Agent Harness & Skill Suite for Tech Workshops, BWAI, DevFest, and Hands-on Coding Labs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "reportlab>=4.0.0",
    "pymupdf>=1.23.0",
    "pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["harness_cli.py", "skills", "templates"]

[tool.hatch.build.targets.sdist]
only-include = ["harness_cli.py", "skills", "templates", "README.md", "pyproject.toml"]
