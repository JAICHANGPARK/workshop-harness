name: Deploy Documentation & Landing Page

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Grant GITHUB_TOKEN permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs & Dependencies
        run: |
          uv pip install --system mkdocs mkdocs-material mkdocs-static-i18n reportlab pymupdf pillow

      - name: Build MkDocs Documentation Site
        run: |
          python3 -m mkdocs build --clean --site-dir site

      - name: Bundle Website Landing Page into Site Output
        run: |
          mkdir -p site/website
          cp -r website/* site/website/

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
